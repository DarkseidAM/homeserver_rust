services:
  homeserver-rust:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    container_name: homeserver-rust
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    ports:
      - "8081:8081"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - CONFIG_FILE=/app/config/application.toml
      - RUST_LOG=info
      - PUID=${PUID}
      - PGID=${PGID}
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config/application.toml
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/app/homeserver", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
